# GameSir G7 Pro Amazon edition, wired 3537:10ba (author-tested fw 2.36).
# Protocol source:
# https://github.com/broroeror/gamesir-linux-tools/blob/771b28ae75b0a614a6a7fec9aa606606a27b3b8d/vendors/gamesir/models/g7pro/protocol.py
# Heartbeat-only session maintenance follows reader.py at the same commit.
# Sequence source: vendors/gamesir/control.py at the same commit.
# No onboard profile writes or identity-switch handshake are sent.
# The reference also queries profile/firmware every 2s; this F2-only route
# has not established heartbeat necessity or sufficiency on hardware.
# Prototype: no local hardware validation. Use --config explicitly; daemon
# auto-discovery currently requires a hidraw anchor this identity lacks.
# Other editions, receiver identities and G7 Pro 8K are not covered.

[device]
name = "GameSir G7 Pro Amazon (wired)"
vid = 0x3537
pid = 0x10ba

[[device.interface]]
id = 0
class = "vendor"
ep_in = 0x82
ep_out = 0x02

[device.keepalive]
interface = 0
packet = "0f000002f200"
report_size = 64
period_ms = 450
sequence_offset = 2
sequence_start = 1
# Reference control.py sequencer emits 1..255, never zero.
sequence_skip_zero = true
# Three priming packets with a 50ms interval after each; the first regular
# packet follows at 150ms, subsequent intervals are 450ms (plus write time).
startup_count = 3
startup_interval_ms = 50

[[report]]
name = "telemetry"
interface = 0
size = 64

[report.match]
offset = 3
expect = [0x3c, 0xe0]

[report.fields]
# Processed stick axes rest at 128, range 0..255. This existing linear
# normalization maps 128 to 128 in signed output; no inferred Y inversion
# or physical calibration. Confirm direction and centering on hardware.
left_x = { offset = 5, type = "u8", transform = "scale(-32768, 32767)" }
left_y = { offset = 6, type = "u8", transform = "scale(-32768, 32767)" }
right_x = { offset = 7, type = "u8", transform = "scale(-32768, 32767)" }
right_y = { offset = 8, type = "u8", transform = "scale(-32768, 32767)" }
lt = { offset = 12, type = "u8" }
rt = { offset = 13, type = "u8" }
# Author's physical hat: 0..7 clockwise; both 8 and 15 are neutral.
dpad = { bits = [55, 0, 4] }

# Pre-remap buttons: processed bytes 9/10 lose independent paddle identity.
# Byte 60 is analog RT, never a paddle bitfield.
[report.button_group]
source = { offset = 55, size = 4 }
map = { X = 4, A = 5, B = 6, Y = 7, LB = 8, RB = 9, Select = 12, Start = 13, LS = 14, RS = 15, Home = 16, Capture = 17, M1 = 19, M2 = 20, M3 = 24, M4 = 25 }

[output]
name = "Xbox Elite Series 2 GameSir"
vid = 0x045e
pid = 0x0b00

[output.axes]
left_x = { code = "ABS_X", min = -32768, max = 32767, fuzz = 16, flat = 128 }
left_y = { code = "ABS_Y", min = -32768, max = 32767, fuzz = 16, flat = 128 }
right_x = { code = "ABS_RX", min = -32768, max = 32767, fuzz = 16, flat = 128 }
right_y = { code = "ABS_RY", min = -32768, max = 32767, fuzz = 16, flat = 128 }
lt = { code = "ABS_Z", min = 0, max = 255 }
rt = { code = "ABS_RZ", min = 0, max = 255 }

[output.buttons]
A = "BTN_SOUTH"
B = "BTN_EAST"
X = "BTN_NORTH"
Y = "BTN_WEST"
LB = "BTN_TL"
RB = "BTN_TR"
Select = "BTN_SELECT"
Start = "BTN_START"
LS = "BTN_THUMBL"
RS = "BTN_THUMBR"
Home = "BTN_MODE"
Capture = "BTN_MISC"
M1 = "BTN_TRIGGER_HAPPY1"
M2 = "BTN_TRIGGER_HAPPY2"
M3 = "BTN_TRIGGER_HAPPY3"
M4 = "BTN_TRIGGER_HAPPY4"

[output.dpad]
type = "hat"
