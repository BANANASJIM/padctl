# Original Wolverine V3 Pro for Xbox (RZ06-0520), PC Tournament mode only.
# PID and Xbox 360 wire format: paroj/xpad PR #324, commit
# 3e79f00201178e5364e3bcd205e10411c5bc6501.
# Transport addresses are resolved from descriptors, not borrowed from the
# different Wolverine V3 Pro 8K PC. Hardware bringup remains unverified here.
# Start explicitly with --config; automatic discovery requires a real HID anchor.
[device]
name = "Razer Wolverine V3 Pro (PC Tournament Mode)"
vid = 0x1532
pid = 0x0a4c

[[device.interface]]
id = 0 # Logical report routing ID; physical interface is selected below.
class = "vendor"
# The three Razer vendor-specific interface patterns from pinned xpad. The explicit
# PID entry selects Xbox 360 decoding before protocol inference; its actual
# descriptor triple still needs hardware confirmation. Require one active match.
usb_match_any = [[0xff, 0x5d, 0x01], [0xff, 0x5d, 0x81], [0xff, 0x47, 0xd0]]

[[report]]
name = "xbox360"
interface = 0
size = 20
[report.match]
offset = 0
expect = [0x00, 0x14]
[report.fields]
left_x = { offset = 6, type = "i16le" }
left_y = { offset = 8, type = "i16le", transform = "negate" }
right_x = { offset = 10, type = "i16le" }
right_y = { offset = 12, type = "i16le", transform = "negate" }
lt = { offset = 4, type = "u8" }
rt = { offset = 5, type = "u8" }
[report.button_group]
source = { offset = 2, size = 2 }
map = { DPadUp = 0, DPadDown = 1, DPadLeft = 2, DPadRight = 3, Start = 4, Select = 5, LS = 6, RS = 7, LB = 8, RB = 9, Home = 10, A = 12, B = 13, X = 14, Y = 15 }

[output]
emulate = "xbox-360"
[output.buttons]
A = "BTN_SOUTH"
B = "BTN_EAST"
X = "BTN_NORTH"
Y = "BTN_WEST"
LB = "BTN_TL"
RB = "BTN_TR"
Select = "BTN_SELECT"
Start = "BTN_START"
Home = "BTN_MODE"
LS = "BTN_THUMBL"
RS = "BTN_THUMBR"
[output.dpad]
type = "hat"
